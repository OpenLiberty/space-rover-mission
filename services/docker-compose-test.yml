version: "3.9"
services:
    gameservice:
        build: ./game
        ports:
            - "9070:9080"
    client:
        build:
            context: ./client
            args:
                - GAME_URL=http://localhost:9070/game
                - GAME_SOCKET_URL=ws://localhost:9070/roversocket
        ports:
            - "3000:80"
    mockrover:
        build: ./mock/rover
        ports:
            - "5045:5045"
    mockboard:
        build: ./mock/board
        ports:
            - "5046:5045"
    bob-bridge:
        build: ./bob-bridge
        ports:
            - "127.0.0.1:4000:4000"
        volumes:
            # Mount the full repo root as /workspace so Bob loads .bob/rules/
            # and the rover-spec skill, and so scripts written to
            # specs/scripts/ are served by GET /scripts at runtime.
            - ../:/workspace
        env_file:
            - .env
        environment:
            - BOB_BRIDGE_PORT=4000
            - SCRIPTS_DIR=/workspace/specs/scripts
            # Bob Shell reads BOBSHELL_API_KEY for headless auth
            - BOBSHELL_API_KEY=${BOB_API_KEY}
        restart: unless-stopped

